name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APK
        run: ./gradlew :app:assembleRelease
        env:
          MANGAREADER_GITHUB_RELEASE: "true"
          storeFile: ${{ runner.temp }}/release.jks
          storePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Collect APKs
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          cp app/build/outputs/apk/release/app-universal-release.apk "dist/MangaReader-$version.apk"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/MangaReader-$version-$abi.apk"
          done

      - name: Publish release
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
